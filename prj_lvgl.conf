CONFIG_LVGL=y

# Keep memory within ESP32 DRAM limits for the lightweight LVGL debug scene.
CONFIG_MAIN_STACK_SIZE=3584
CONFIG_HEAP_MEM_POOL_SIZE=7168

# LVGL Zephyr glue tuning for ST7789 color panel.
CONFIG_LV_Z_MEM_POOL_SIZE=3072
CONFIG_LV_Z_MONOCHROME_CONVERSION_BUFFER=n
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=n
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_ST7789V_RGB565=y
CONFIG_ST7789V_RGB565X=n
