CONFIG_LVGL=y

# Keep memory within ESP32 DRAM limits for the lightweight LVGL debug scene.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=24576

CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_MONOCHROME_CONVERSION_BUFFER=n
CONFIG_LV_Z_BUFFER_ALLOC_DYNAMIC=y
CONFIG_LV_Z_BUFFER_ALLOC_STATIC=n
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_COLOR_16_SWAP=n
CONFIG_LV_FONT_UNSCII_16=y
